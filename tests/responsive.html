<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GNX 14 Responsive QA</title><style>body{margin:0;background:#20282b;color:white;font:14px system-ui}nav{padding:10px;display:flex;gap:8px}button,a{padding:8px}iframe{display:block;width:390px;height:800px;border:1px solid #53756f;margin:auto;background:#090e12}output{display:block;padding:10px;font-size:12px;white-space:pre-wrap}</style><nav><button data-width="390">390px</button><button data-width="360">360px</button><button data-width="1280">1280px</button><button id="db">攻略一覧</button><button id="npc">NPC詳細</button><button id="static">静的詳細</button><button id="measure">寸法確認</button></nav><output id="metrics">読み込み中</output><iframe id="frame" title="GNX responsive preview" src="../index.html#/elden"></iframe><script>
const f=document.getElementById('frame'),o=document.getElementById('metrics');function measure(){const d=f.contentDocument,w=f.contentWindow;o.textContent=JSON.stringify({viewport:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,title:d.title},null,2)}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.style.width=b.dataset.width+'px';requestAnimationFrame(measure)});document.getElementById('db').onclick=()=>f.src='../index.html#/elden';document.getElementById('npc').onclick=()=>f.src='../index.html#/elden/npc-rya';document.getElementById('static').onclick=()=>f.src='../elden/npc-rya/';document.getElementById('measure').onclick=measure;f.onload=measure;
</script></html>
